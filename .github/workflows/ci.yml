name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 执行测试与生产构建
        run: npm run check
